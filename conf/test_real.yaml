# Setup options
environment_type: real
agent: MQR                    # Choose one between MQR and CQL.             
object_type: dexnet
seed: 1234
num_objects: 310               # The number of objects spawned within the robot workspace
heightmap_resolution: 0.002
num_rotations: 16

# Is continue logging data?
is_continue: False
data_directory: False

# Algorithm options
future_reward_discount: 0.5
method: False

# Testing options
is_testing: True
is_challenging: False
max_test_episodes: 30
model_weight: 'logs/model.pth'       # Please write the path to the weight file for offline RL policy.

# Logging option
log_directory: 'logs/test_real/'
save_visualization: True

# Real world options
robot:
  ip: "192.168.1.28"
  home_pose: [0.100, -0.200, 0.500, 3.14, 0.0, 3.14]
  placing_pose: [-0.505, -0.515, 0.300, 3.14, 0.0, 3.14]
  workspace: [[-0.316, 0.132], [-0.772, -0.324]] # [x_min, x_max], [y_min, y_max]

gripper:
  # sudo chmod a+rw /dev/ttyUSB0
  port: "/dev/ttyUSB0"
  baudrate: 115200
  finger_width: 0.04
  opened_length: 0.17

camera:
  color_resolution: 720
  depth_mode: "NFOV_2X2BINNED"
  pose:
    [
      [0.0043, 0.9998, 0.0193, -0.09277],
      [0.9995, -0.0041, -0.0088, -0.46301],
      [-0.0087, 0.0193, -0.9997, 0.87484],
      [0, 0, 0, 1],
    ]
