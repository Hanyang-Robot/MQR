# Setup options
environment_type: real
agent: vpg
object_type: dexnet
seed: 1234
num_objects: 10                   # The number of objects spawned within the robot workspace
heightmap_resolution: 0.002
num_rotations: 16
max_train_steps: 50000            # The number of offline datasets to be collected

# Is continue logging data?
is_continue: False
data_directory: False

# Algorithm options
future_reward_discount: 0.5       # discount factor 
explore_probability: 0.5          # epsilon value for exploration (e.g, epsilon-greedy policy)
explore_probability_decay: True   # When this value is enabled, the exploration probability gradually decreases from 50% to 10%.

# Testing options
is_testing: False

# Logging options
log_directory: 'logs/offline_dataset_real/'
save_visualization: False         # When this option is enabled, the grasp Q-map and push Q-map are stored, and note that these data can be quite large in size.

# Env options
camera:
  resolution: # NFOV_UNBINNED
    width: 640
    height: 576
  fovy: 65
  depth_noise:
    mean: 0
    std: 0.003 # s4g

# Real world options
# Configuration options for UR5e
robot:
  ip: '192.168.1.28'            # Since we used TCP/IP communication between the robot and the PC, assigning an IP address to the robot is essential. To control the robot using this method, you must enter the robot’s IP address.
  home_pose: [0.100, -0.200, 0.500, 3.14, 0.0, 3.14]      # [x, y, z, rx, ry, rz]
  placing_pose: [-0.505, -0.515, 0.300, 3.14, 0.0, 3.14]  # [x, y, z, rx, ry, rz]
  workspace: [[-0.316, 0.132], [-0.772, -0.324]]          # [x_min, x_max], [y_min, y_max]

# Configuration options for robotiq 2F-85 with RS-485 Serial Communication
gripper:
  # sudo chmod a+rw /dev/ttyUSB0
  port: "/dev/ttyUSB0"
  baudrate: 115200
  finger_width: 0.04
  opened_length: 0.17

# Configuration options for the Microsoft Azure Kinect camera. 
camera:
  color_resolution: 720
  depth_mode: 'NFOV_2X2BINNED'

  # This represents the rotation–translation transformation matrix between the robot and the camera, which can be obtained through camera calibration. 
  # For more details, please refer to the VPG's github: https://github.com/andyzeng/visual-pushing-grasping
  pose: [[0.0043, 0.9998, 0.0193, -0.09277],
         [0.9995, -0.0041, -0.0088, -0.46301],
         [-0.0087, 0.0193, -0.9997, 0.87484],
         [0, 0, 0, 1]]