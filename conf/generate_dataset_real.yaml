# sudo chmod a+rw /dev/ttyUSB0

# Setup options
environment_type: real
agent: vpg
object_type: dexnet
seed: 1234
num_objects: 10
heightmap_resolution: 0.002
num_rotations: 16
max_train_steps: 50000

# Is continue logging data?
is_continue: False
data_directory: ''

# Algorithm options
future_reward_discount: 0.5
explore_probability: 0.5
explore_probability_decay: True

# Testing options
is_testing: False
max_test_episodes: 10

# Logging options
log_directory: 'logs'
save_visualization: True

camera:
  # mode: NFOV_UNBINNED
  resolution:
    width: 640
    height: 576
  fovy: 65
  depth_noise:
    mean: 0
    std: 0.003 # s4g

# Real world options
robot:
  ip: '192.168.1.28'
  home_pose: [0.100, -0.200, 0.500, 3.14, 0.0, 3.14]
  placing_pose: [-0.505, -0.515, 0.300, 3.14, 0.0, 3.14]
  workspace: [[-0.316, 0.132], [-0.772, -0.324]] # [x_min, x_max], [y_min, y_max]
  
gripper:
  # sudo chmod a+rw /dev/ttyUSB0
  port: "/dev/ttyUSB0"
  baudrate: 115200
  finger_width: 0.04
  opened_length: 0.17

camera:
  color_resolution: 720
  depth_mode: 'NFOV_2X2BINNED'
  pose: [[0.0043, 0.9998, 0.0193, -0.09277],
         [0.9995, -0.0041, -0.0088, -0.46301],
         [-0.0087, 0.0193, -0.9997, 0.87484],
         [0, 0, 0, 1]]